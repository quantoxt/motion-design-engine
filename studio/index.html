<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion studio</title>
<link rel="preload" href="fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Bricolage Grotesque (SIL OFL 1.1, studio/fonts/OFL.txt), bundled so the studio works offline */
@font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 300 700; font-stretch: 75% 100%; font-display: swap;
  src: url(fonts/bricolage-latin-ext.woff2) format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 300 700; font-stretch: 75% 100%; font-display: swap;
  src: url(fonts/bricolage-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

:root {
  --table: #E7EBEF;     /* light table */
  --sheet: #F7F9FB;
  --ink: #12141A;
  --soft: #5B6270;
  --rule: #C4CBD4;
  --strip: #1E2430;     /* film strip */
  --strip-hole: #E7EBEF;
  --accent: #3B2FE0;
  --accent-wash: #E4E2FC;
  --danger: #B42318;
  --font: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --rail: 208px;
  --bar: 76px;
}
* { box-sizing: border-box; }
html { background: var(--table); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.5; }
body { margin: 0; }
::selection { background: var(--accent-wash); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ── Layout ─────────────────────────────────────────── */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }

/* Film-strip rail: sprocket holes on both edges, one frame per section */
.rail {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 28px 30px calc(var(--bar) + 20px);
  background:
    radial-gradient(circle at 50% 50%, var(--strip-hole) 0 3.5px, transparent 4px) 9px 0 / 1px 22px repeat-y,
    radial-gradient(circle at 50% 50%, var(--strip-hole) 0 3.5px, transparent 4px) calc(100% - 9px) 0 / 1px 22px repeat-y,
    var(--strip);
  background-size: 8px 22px, 8px 22px, auto;
  background-position: 6px 0, calc(100% - 6px) 0, 0 0;
}
.rail h2 { color: #AEB6C4; font-size: 0.78rem; font-weight: 500; margin: 0 0 16px; letter-spacing: 0.01em; }
.frames { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.frames a {
  display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 8px;
  color: #C9D0DB; text-decoration: none; font-size: 0.8rem; line-height: 1.2;
  padding: 7px 8px; border: 1px solid #39414F; border-radius: 3px;
}
.frames a .n { font-variation-settings: "opsz" 96; font-size: 1.25rem; font-weight: 600; color: #6E7788; text-align: center; }
.frames a[data-lit="true"] { border-color: var(--accent); background: #2A2A63; color: #fff; }
.frames a[data-lit="true"] .n { color: #fff; }
.frames a:hover { border-color: #7A8496; }
/* The section (or gate) you're looking at: a white bar on the frame's leading edge */
.frames a[aria-current="true"] { border-color: #fff; color: #fff; box-shadow: inset 4px 0 0 #fff; }
.frames a[aria-current="true"] .n { color: #fff; }
/* Navbar: the studio's top-level pages, at the head of the rail */
.nav { list-style: none; margin: 0 0 26px; padding: 0 0 18px; border-bottom: 1px solid #39414F; display: grid; gap: 2px; }
.nav a { display: block; color: #AEB6C4; text-decoration: none; font-weight: 500; font-size: 1rem; padding: 5px 0; }
.nav a:hover { color: #fff; }
.nav a[aria-current="page"] { color: #fff; font-weight: 700; }
.nav a[aria-current="page"]::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; background: var(--accent); border-radius: 50%; vertical-align: 0.1em; }
.rail h2:empty { display: none; }

/* ── Briefs list ────────────────────────────────────── */
.list-head { display: flex; align-items: end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.list-head h1, .film-head h1 { margin: 0; font-weight: 300; font-variation-settings: "opsz" 96; font-size: clamp(2.6rem, 6vw, 4.4rem); line-height: 1; letter-spacing: -0.02em; }
.rows { list-style: none; margin: 40px 0 0; padding: 0; border-top: 2px solid var(--ink); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--rule); }
.row .name { font-size: 1.45rem; font-weight: 600; font-variation-settings: "opsz" 48; letter-spacing: -0.01em; line-height: 1.2; }
.row .name .untitled { color: var(--soft); font-weight: 400; }
.row .meta { color: var(--soft); font-size: 0.9rem; margin-top: 4px; }
.row .meta code { background: none; padding: 0; }
.row .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: end; }
.progress { display: inline-flex; gap: 3px; vertical-align: -2px; margin-right: 8px; }
.progress i { width: 9px; height: 13px; border-radius: 2px; background: #D3D8DF; }
.progress i.on { background: var(--accent); }
.empty { margin-top: 40px; padding: 40px 0; border-top: 2px solid var(--ink); color: var(--soft); max-width: 52ch; }
a.button { display: inline-block; text-decoration: none; font: inherit; border-radius: 999px; padding: 10px 20px; border: 1.5px solid var(--ink); color: var(--ink); white-space: nowrap; }
a.button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
a.button:hover { background: var(--ink); color: var(--sheet); }
a.button.primary:hover { background: #2E23C2; color: #fff; }

/* ── Film / gates ───────────────────────────────────── */
.film-head p { color: var(--soft); margin: 14px 0 0; }
.gates { list-style: none; margin: 40px 0 0; padding: 0; border-top: 2px solid var(--ink); counter-reset: g; }
.gate { display: grid; grid-template-columns: 3.2rem minmax(0, 1fr) auto; gap: 4px 18px; padding: 18px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
.gate .n { font-variation-settings: "opsz" 96; font-size: 2rem; font-weight: 300; line-height: 1; color: var(--rule); }
.gate .gname { font-size: 1.15rem; font-weight: 600; }
.gate .ev { grid-column: 2; color: var(--soft); font-size: 0.9rem; }
.gate .ev code { background: none; padding: 0; }
.gate .gnote { grid-column: 2; font-size: 0.9rem; }
.gate .st { font-size: 0.88rem; padding: 3px 12px; border-radius: 999px; border: 1.5px solid var(--rule); color: var(--soft); white-space: nowrap; }
.gate[data-state="done"] .n { color: var(--accent); }
.gate[data-state="done"] .st { border-color: var(--accent); background: var(--accent); color: #fff; }
.gate[data-state="current"] .n { color: var(--ink); }
.gate[data-state="current"] .st { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.gate[data-state="todo"] .gname { color: var(--soft); font-weight: 500; }
.handoff { margin: 28px 0 36px; padding: 22px 24px; background: var(--strip); color: #E3E7EE; border-radius: 4px; }
.handoff p { margin: 0 0 12px; }
.handoff .cmd { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.handoff code { background: #2C3442; color: #fff; padding: 8px 12px; font-size: 0.95rem; }
.handoff button { border-color: #E3E7EE; color: #E3E7EE; padding: 7px 16px; }
.handoff button:hover { background: #E3E7EE; color: var(--strip); }
.handoff small { display: block; margin-top: 12px; color: #AEB6C4; }
.agent-strip { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.agent-strip p { margin: 0; font-size: 1.05rem; color: #fff; overflow-wrap: anywhere; }
.handoff a.button.run { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.handoff a.button.run:hover { background: #5248F0; }
.handoff small code { padding: 3px 8px; font-size: 0.85rem; }
.handoff button.copy { padding: 3px 10px; font-size: 0.85rem; }
/* Agent page: the terminal takes the whole viewport beside the gate rail. */
.page.run { max-width: none; height: 100vh; display: flex; flex-direction: column; padding: 24px clamp(16px, 3vw, 40px); box-sizing: border-box; }
.run-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.run-head h1 { margin: 0; font-weight: 300; font-variation-settings: "opsz" 96; font-size: clamp(1.8rem, 3.5vw, 2.6rem); line-height: 1; letter-spacing: -0.02em; }
.run-box { flex: 1; min-height: 0; margin: 0; display: flex; flex-direction: column; }
.run-box .agent { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.run-box .term { flex: 1; min-height: 240px; height: auto; }
.runners { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.runner { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid #4A5366; border-radius: 999px; cursor: pointer; color: #E3E7EE; }
.runner:has(input:checked) { border-color: #fff; background: #2C3442; }
.runner input { accent-color: var(--accent); margin: 0; }
.custom-cmd { flex: 1 1 260px; min-width: 0; background: #2C3442; border: 1px solid #4A5366; color: #fff; padding: 7px 12px; font: 0.95rem ui-monospace, Menlo, monospace; border-radius: 4px; }
.custom-cmd[hidden] { display: none; }
.term-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 12px; }
.handoff button.run { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.handoff button.run:hover { background: #5248F0; color: #fff; }
.handoff button.run:disabled { background: transparent; border-color: #4A5366; color: #AEB6C4; cursor: default; }
.handoff button.kill { border-color: #F29C94; color: #F29C94; }
.handoff button.kill:hover { background: #F29C94; color: var(--strip); }
.term-status { color: #AEB6C4; font-size: 0.9rem; overflow-wrap: anywhere; }
.term-status[data-state="running"] { color: #fff; }
.term { height: min(70vh, 560px); background: #141922; padding: 8px; border-radius: 4px; }
.term[hidden] { display: none; }
.flash { color: var(--accent); font-weight: 600; }
.gate .st.ask { border-color: var(--accent); color: var(--accent); font-weight: 600; background: var(--accent-wash); }
.gacts { grid-column: 2 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 10px; }
.gacts button { padding: 7px 16px; }
.hint { color: var(--soft); font-size: 0.88rem; }
.shot { grid-column: 2 / -1; margin-top: 14px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--sheet); }
.shot .flash { margin: 0; padding: 12px 18px; border-bottom: 1px solid var(--rule); }
.shot-text { margin: 0; padding: 18px; max-height: 60vh; overflow: auto; white-space: pre-wrap; word-break: break-word;
  font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.86rem; line-height: 1.55; }
.shot-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--rule); }

.page { padding: 56px clamp(20px, 6vw, 88px) calc(var(--bar) + 64px); max-width: 980px; }

/* ── Headline: the brand name is typed into it ─────── */
.head h1 {
  margin: 0; font-weight: 300; font-variation-settings: "opsz" 96;
  font-size: clamp(2.6rem, 6.4vw, 5rem); line-height: 1.02; letter-spacing: -0.02em;
}
.head h1 .lead { display: block; color: var(--soft); }
.head h1 input {
  font: inherit; font-weight: 600; color: var(--ink); letter-spacing: inherit;
  width: 100%; max-width: 15ch; border: 0; border-bottom: 4px solid var(--ink); background: none; padding: 0 0 4px; border-radius: 0;
}
.head h1 input::placeholder { color: var(--rule); font-weight: 300; }
.head h1 input:focus-visible { outline: none; border-bottom-color: var(--accent); }
.head p { max-width: 58ch; color: var(--soft); margin: 22px 0 0; font-size: 1.05rem; }

/* ── Sections ──────────────────────────────────────── */
section { margin-top: 72px; scroll-margin-top: 24px; }
section > header { display: flex; align-items: baseline; gap: 16px; border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 8px; }
section > header .n { font-variation-settings: "opsz" 96; font-size: 2.6rem; font-weight: 300; line-height: 1; color: var(--accent); min-width: 1.4ch; }
section > header h3 { margin: 0; font-size: 1.6rem; font-weight: 600; font-variation-settings: "opsz" 48; letter-spacing: -0.01em; }
.note { color: var(--soft); max-width: 62ch; margin: 14px 0 6px; font-size: 0.95rem; }
.note em { font-style: normal; }
.text { max-width: 66ch; margin: 10px 0; font-size: 0.95rem; }
.sub { margin: 28px 0 4px; font-weight: 600; }
.sub small { display: block; font-weight: 400; color: var(--soft); font-size: 0.88rem; }
code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.88em; background: #DDE2E8; padding: 1px 5px; border-radius: 3px; }

/* Fill-in-the-blank fields */
.field { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 16px 0 6px; border-bottom: 1px solid var(--rule); }
.field .t { font-size: 0.98rem; }
.field .t:first-child { flex: 0 0 100%; color: var(--ink); }
.field .t:first-child strong { font-weight: 600; }
.field .t:not(:first-child) { color: var(--soft); font-size: 0.9rem; }
.blank {
  flex: 1 1 14rem; min-width: 8rem; font: inherit; font-size: 1.08rem; color: var(--ink);
  border: 0; background: none; padding: 4px 0; border-radius: 0;
}
.blank::placeholder { color: #9AA3B0; }
.field:focus-within { border-bottom-color: var(--accent); }
.blank:focus-visible { outline: none; }
.field:has(.blank:focus-visible) { box-shadow: 0 2px 0 var(--accent); }

/* Choices: chips; "agent decides" is hatched so delegated answers stand out */
.choice { padding: 18px 0 14px; border-bottom: 1px solid var(--rule); }
.choice > .q { font-weight: 600; margin-bottom: 10px; }
.choice > .q small { font-weight: 400; color: var(--soft); margin-left: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip > input[type=radio], .chip > input[type=checkbox] { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip > label {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
  padding: 7px 14px; border: 1.5px solid var(--rule); border-radius: 999px; background: var(--sheet);
  font-size: 0.93rem; line-height: 1.3;
}
.chip > label::before {
  content: ""; width: 12px; height: 12px; border: 1.5px solid var(--soft); flex: none;
}
.chip > input[type=radio] + label::before { border-radius: 50%; }
.chip > input[type=checkbox] + label::before { border-radius: 3px; }
.chip > label:hover { border-color: var(--soft); }
.chip > input:checked + label { border-color: var(--accent); background: var(--accent-wash); }
.chip > input:checked + label::before { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent-wash); }
.chip > input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
.chip.delegate > label { border-style: dashed; color: var(--soft); }
.chip.delegate > input:checked + label {
  color: var(--ink);
  background: repeating-linear-gradient(-45deg, var(--accent-wash) 0 6px, #F2F1FE 6px 12px);
}
.chip .inline { font: inherit; border: 0; border-bottom: 1.5px solid var(--rule); background: transparent; width: 9rem; padding: 0 2px; border-radius: 0; }
.chip .inline:focus-visible { outline: none; border-bottom-color: var(--accent); }

/* ── Save bar ─────────────────────────────────────── */
.bar {
  position: fixed; inset: auto 0 0 var(--rail); height: var(--bar); z-index: 5;
  display: flex; align-items: center; gap: 18px; padding: 0 clamp(20px, 6vw, 88px);
  background: var(--sheet); border-top: 2px solid var(--ink);
}
.bar[hidden] { display: none; }
.bar .where { flex: 1; min-width: 0; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .where b { font-weight: 600; }
.bar .where.err { color: var(--danger); }
.bar .count { color: var(--soft); font-size: 0.88rem; white-space: nowrap; }
button { font: inherit; cursor: pointer; border-radius: 999px; padding: 10px 20px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); white-space: nowrap; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button.primary:hover { background: #2E23C2; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.quiet { border-color: transparent; color: var(--soft); padding-inline: 10px; }
button.quiet:hover { color: var(--ink); }
.saved { animation: pulse 0.6s ease-out; }
@keyframes pulse { from { box-shadow: 0 0 0 0 rgba(59,47,224,0.45); } to { box-shadow: 0 0 0 14px rgba(59,47,224,0); } }

.loading, .fatal { padding: 80px 40px; color: var(--soft); max-width: 60ch; }
.fatal { color: var(--danger); }

/* ── Navbar badges ──────────────────────────────────── */
.nav .badge { display: inline-block; min-width: 20px; padding: 1px 6px; margin-left: 4px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 0.75rem; font-weight: 700; text-align: center; }
.nav .dot { display: inline-block; width: 8px; height: 8px; margin-left: 6px; border-radius: 50%; background: #3DDC97; vertical-align: 0.1em; }
.nav .badge[hidden], .nav .dot[hidden] { display: none; }

/* ── Home dashboard ─────────────────────────────────── */
.dash { margin-bottom: 64px; }
.dash-h { font-size: 1.2rem; font-weight: 600; margin: 40px 0 0; display: flex; gap: 14px; align-items: baseline; }
.dash-h a { font-size: 0.9rem; font-weight: 500; color: var(--accent); }
.needs { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 10px; }
.needs li { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 16px 20px; background: var(--sheet); border-left: 4px solid var(--accent); }
.needs li[data-kind="agent"] { border-left-color: var(--danger); }
.needs.running li { border-left-color: #3DDC97; }
.needs .name { font-weight: 600; }
.needs .meta { color: var(--soft); font-size: 0.92rem; margin-top: 2px; }
.recent { list-style: none; margin: 18px 0 0; padding: 0; display: flex; gap: 18px; flex-wrap: wrap; }
.recent a { display: grid; gap: 8px; width: 140px; color: var(--ink); text-decoration: none; font-size: 0.88rem; }
.recent img, .recent video { width: 140px; height: 175px; object-fit: contain; background: var(--strip); border: 6px solid var(--sheet); outline: 1px solid var(--rule); }
.recent a:hover img, .recent a:hover video { outline: 2px solid var(--accent); }
.briefs-head { padding-top: 40px; border-top: 1px solid var(--rule); }

/* ── Agents ─────────────────────────────────────────── */
.agent-film { margin-top: 48px; }
.agent-film h2 { margin: 0; font-size: 1.6rem; font-weight: 400; }
.sessions { list-style: none; margin: 14px 0 0; padding: 0; border-top: 1px solid var(--rule); }
.sessions li { display: grid; grid-template-columns: 110px 140px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); font-size: 0.95rem; }
.sessions .when { color: var(--soft); }
.sessions li[data-state="running"] .how { color: #128A55; font-weight: 600; }
.sessions li[data-state="interrupted"] .how { color: var(--danger); }
.sessions button { padding: 5px 14px; }
.transcript { display: inline-block; margin-top: 10px; color: var(--accent); font-weight: 600; font-size: 0.92rem; }

/* ── Film page: brief drift + inline review ─────────── */
.drift { margin: 24px 0 0; padding: 16px 20px; background: var(--accent-wash); border-left: 4px solid var(--accent); display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.drift[hidden] { display: none; }
.drift p { margin: 0; flex: 1 1 320px; }
.drift .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.gate .review { display: block; grid-column: 1 / -1; max-width: min(100%, 360px); max-height: 420px; margin-top: 12px; background: var(--strip); }
.gate .review-img { grid-column: 1 / -1; display: block; margin-top: 12px; }
.gate .review-img img { max-width: 100%; max-height: 420px; display: block; border: 1px solid var(--rule); }

/* ── Film Library ─────────────────────────────────────── */
.lib-sub { color: var(--soft); margin: 14px 0 0; }
/* Brand folders: slide mounts on the light table; extra formats show as sheets stacked behind */
.folders { list-style: none; margin: 40px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 44px 36px; }
.folder { display: block; color: var(--ink); text-decoration: none; }
.folder .mount { aspect-ratio: 4 / 5; background: var(--strip); border: 12px solid var(--sheet); border-radius: 3px; display: grid; place-items: center; overflow: hidden; outline: 1px solid var(--rule); }
.folder[data-stack="1"] .mount { box-shadow: 8px 8px 0 -1px var(--sheet), 8px 8px 0 0 var(--rule); }
.folder[data-stack="2"] .mount { box-shadow: 8px 8px 0 -1px var(--sheet), 8px 8px 0 0 var(--rule), 16px 16px 0 -1px var(--sheet), 16px 16px 0 0 var(--rule); }
.folder .mount img, .folder .mount video { width: 100%; height: 100%; object-fit: contain; display: block; }
.folder:hover .mount { outline: 2px solid var(--accent); }
.folder:focus-visible { outline: none; }
.folder:focus-visible .mount { outline: 3px solid var(--accent); }
.fname { margin-top: 18px; font-weight: 600; font-size: 1.15rem; }
.fmeta { color: var(--soft); font-size: 0.88rem; margin-top: 4px; }
/* One brand: its films side by side at true proportions, same height */
.shelf { list-style: none; margin: 36px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-end; }
.film { --h: clamp(260px, 56vh, 540px); width: min(100%, calc(var(--h) * var(--ar))); }
.film .screen { all: unset; box-sizing: border-box; position: relative; display: block; width: 100%; aspect-ratio: var(--ar); background: var(--strip); cursor: pointer; border-radius: 3px; overflow: hidden; }
.film .screen video { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
.film .screen .play { position: absolute; inset: 0; margin: auto; width: 64px; height: 64px; border-radius: 50%; background: var(--accent); }
.film .screen .play::after { content: ""; position: absolute; left: 25px; top: 20px; border-left: 20px solid #fff; border-top: 12px solid transparent; border-bottom: 12px solid transparent; }
.film .screen:hover .play { background: #5248F0; }
.film .screen:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.film .dl { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 0.9rem; }
.film .dl a { color: var(--accent); font-weight: 600; }
/* Player: black, the film fitted to the screen */
.player { border: 0; padding: 0; margin: 0; width: 100vw; height: 100vh; max-width: none; max-height: none; background: #000; color: #E3E7EE; }
.player::backdrop { background: #000; }
.player[open] { display: flex; flex-direction: column; }
.player video { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #000; }
.player .p-bar { display: flex; gap: 10px; align-items: center; padding: 10px 16px; flex-wrap: wrap; }
.player .p-title { flex: 1; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.player button { border-color: #4A5366; color: #E3E7EE; padding: 6px 14px; }
.player button:hover { background: #E3E7EE; color: #000; }

@media (max-width: 760px) {
  .sessions li { grid-template-columns: 1fr auto; }
  .sessions .when { grid-column: 1 / -1; }
  .page.run { height: auto; padding: 16px; }
  .run-box .term { flex: none; height: 70vh; }
  :root { --rail: 0px; }
  .shell { display: block; }
  .rail { position: sticky; z-index: 4; height: auto; padding: 10px 16px; background: var(--strip); overflow-x: auto; }
  .rail h2 { display: none; }
  .rail { display: flex; align-items: center; gap: 14px; }
  .nav { display: flex; gap: 14px; margin: 0; padding: 0 14px 0 0; border-bottom: 0; border-right: 1px solid #39414F; }
  .nav a { white-space: nowrap; padding: 2px 0; }
  .frames { grid-auto-flow: column; grid-auto-columns: max-content; }
  .frames a { grid-template-columns: auto; padding: 4px 10px; }
  .frames a .label { display: none; }
  .page { padding: 36px 16px calc(var(--bar) + 48px); }
  .bar { padding: 0 16px; gap: 10px; }
  .bar .count, #clear { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; scroll-behavior: auto !important; } }
html { scroll-behavior: smooth; }
</style>
